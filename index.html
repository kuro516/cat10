<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1a1a24">
  <title>うさぎロケット - リズムゲーム</title>

  <!-- 基本説明 -->
  <meta name="description" content="最高得点を目指せ！D/F/J/Kキーでプレイするリズムゲーム。">

  <!-- Open Graph 設定 (Slackがメインで読み込むタグ) -->
  <meta property="og:site_name" content="うさぎロケット - リズムゲーム">
  <meta property="og:title" content="うさぎロケット - リズムゲーム">
  <meta property="og:description" content="最高得点を目指せ！D/F/J/Kキーでプレイするリズムゲーム。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kuro516.github.io/cat10/">
  
  <!-- 画像の設定（絶対パスで指定） -->
  <meta property="og:image" content="https://kuro516.github.io/cat10/ogp-image.png">
  <!-- 画像サイズを明示しておくとSlackが即座に認識しやすくなります -->
  <meta property="og:image:width" content="1536">
  <meta property="og:image:height" content="1024">

  <!-- Twitter Card (SlackがOGPの予備として読み込む場合あり) -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="うさぎロケット - リズムゲーム">
  <meta name="twitter:description" content="最高得点を目指せ！D/F/J/Kキーでプレイするリズムゲーム。">
  <meta name="twitter:image" content="https://kuro516.github.io/cat10/ogp-image.png">

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            /* 実際に見えている高さ（JSで window.innerHeight に更新。未対応時は dvh） */
            --app-h: 100vh;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            /* ゲーム画面の幅：スマホでは画面幅いっぱい、PCでは縦長を保って中央に */
            --cw: min(100vw, calc(var(--app-h) * 0.72), 560px);
        }
        @supports (height: 100dvh) {
            :root { --app-h: 100dvh; }
        }

        body {
            background-color: #1a1a24;
            color: #fff;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: var(--app-h);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 画面いっぱいのラッパー（中の要素はここを基準に重ねて配置） */
        .wrapper {
            position: relative;
            width: var(--cw);
            height: var(--app-h);
            padding: 0;
        }

        /* 1. ゲーム画面エリア */
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #2a2a38;
            display: flex;
            overflow: hidden;
            box-shadow: 0 0 0 1px #3a3a4a, 0 0 20px rgba(0,0,0,0.5);
        }

        /* 4つのレーン */
        .lane {
            flex: 1;
            border-right: 1px dashed #444;
            position: relative;
            transition: background-color 0.05s;
            -webkit-tap-highlight-color: transparent;
        }
        .lane:last-child {
            border-right: none;
        }

        /* キー・タップ操作時にレーンが光るスタイル */
        .lane.active {
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(0,246,255,0.25) 100%);
        }

        /* 判定ライン */
        #judge-line {
            position: absolute;
            bottom: calc(var(--safe-bottom) + 66px);
            width: 100%;
            height: 4px;
            background-color: #ff2a6d;
            box-shadow: 0 0 10px #ff2a6d;
            z-index: 10;
        }

        /* ノーツ */
        .note {
            position: absolute;
            width: calc(100% - 10px);
            height: 18px;
            background: linear-gradient(180deg, #00f6ff, #0088ff);
            border-radius: 4px;
            left: 5px;
            box-shadow: 0 0 8px #00f6ff;
            z-index: 5;
            pointer-events: none;
        }

        /* コンボ表示 */
        #combo-container {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            pointer-events: none;
            z-index: 25;
            opacity: 0;
            transition: opacity 0.1s ease-out, transform 0.08s ease-out;
        }

        #combo-count {
            font-size: 42px;
            font-weight: 900;
            color: #ffe600;
            text-shadow: 0 0 15px rgba(255, 230, 0, 0.8);
            line-height: 1;
        }

        #combo-label {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #fff;
        }

        /* 判定テキスト表示エリア */
        #judge-text {
            position: absolute;
            top: 52%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 26px;
            font-weight: 900;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 30;
            opacity: 0;
            transition: opacity 0.1s ease-out, transform 0.1s ease-out;
        }

        .judge-perfect { color: #ffe600; text-shadow: 0 0 12px #ffe600; }
        .judge-great   { color: #00ffcc; text-shadow: 0 0 12px #00ffcc; }
        .judge-good    { color: #ff00aa; text-shadow: 0 0 12px #ff00aa; }
        .judge-miss    { color: #888888; text-shadow: 0 0 6px #888888; }

        /* ノーツヒット時のヒットエフェクト */
        .hit-effect {
            position: absolute;
            width: 100%;
            height: 40px;
            left: 0px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(0,246,255,0.8) 50%, rgba(0,246,255,0) 100%);
            box-shadow: 0 0 20px #00f6ff;
            pointer-events: none;
            z-index: 15;
            animation: pop-flash 0.25s ease-out forwards;
        }

        @keyframes pop-flash {
            0% { transform: scale(0.5); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.9; }
            100% { transform: scale(1.8); opacity: 0; }
        }

        /* キーガイド表示 */
        #key-guides {
            position: absolute;
            left: 0;
            right: 0;
            bottom: calc(var(--safe-bottom) + 8px);
            z-index: 20;
            display: flex;
            padding: 0 4px;
            -webkit-tap-highlight-color: transparent;
        }
        .key-guide {
            flex: 1;
            text-align: center;
            background: rgba(51, 51, 64, 0.85);
            padding: 11px 0;
            margin: 0 2px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            color: #00f6ff;
            transition: background 0.05s, color 0.05s;
        }
        .key-guide.active {
            background: #00f6ff;
            color: #111;
            box-shadow: 0 0 10px #00f6ff;
        }

        /* 2. スコア & 3. フッターエリア */
        #game-footer {
            position: absolute;
            top: calc(var(--safe-top) + 8px);
            left: 0;
            right: 0;
            z-index: 20;
            text-align: center;
            pointer-events: none;
        }

        #score-board {
            font-size: 24px;
            font-weight: bold;
            color: #00f6ff;
            text-shadow: 0 0 8px rgba(0,0,0,0.8);
        }

        /* 全画面切替ボタン */
        .fullscreen-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #ccc;
            border: 1px solid #555;
            border-radius: 12px;
            padding: 5px 12px;
            font-size: 12px;
            cursor: pointer;
            position: absolute;
            top: 0;
            right: 8px;
            z-index: 50;
            pointer-events: auto;
            transition: 0.2s;
        }
        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        /* オーバーレイ画面（スタート／リザルト） */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 40;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .result-rank {
            font-size: 72px;
            font-weight: 900;
            color: #ffe600;
            text-shadow: 0 0 20px #ffe600;
            margin: 5px 0;
            line-height: 1;
        }

        #full-combo-text {
            font-size: 18px;
            font-weight: 900;
            color: #ffea00;
            text-shadow: 0 0 10px #ffea00;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .result-stats {
            text-align: left;
            font-size: 14px;
            line-height: 1.8;
            background: rgba(255,255,255,0.1);
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            width: 80%;
        }

        button.action-btn {
            padding: 12px 24px;
            font-size: 18px;
            background-color: #ff2a6d;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
        }

        button.action-btn:hover {
            background-color: #ff5588;
            transform: scale(1.05);
        }

        /* 縦が極端に短い画面（横向きなど）では少しコンパクトに */
        @media (max-height: 520px) {
            #score-board { font-size: 18px; }
            .key-guide { padding: 7px 0; }
            #judge-line { bottom: calc(var(--safe-bottom) + 52px); }
        }
    </style>
</head>
<body>

    <audio id="bgm" src="usagi_rocket.mp3" preload="auto"></audio>

    <div class="wrapper">
        <!-- 1. ゲーム画面エリア -->
        <div id="game-container">
            <div class="lane" id="lane-0"></div>
            <div class="lane" id="lane-1"></div>
            <div class="lane" id="lane-2"></div>
            <div class="lane" id="lane-3"></div>
            <div id="judge-line"></div>
            
            <!-- コンボ表示 -->
            <div id="combo-container">
                <div id="combo-count">0</div>
                <div id="combo-label">COMBO</div>
            </div>

            <!-- 判定テキスト -->
            <div id="judge-text">PERFECT</div>

            <!-- スタート画面 -->
            <div id="start-overlay" class="overlay">
                <h2>うさぎドロップ</h2>
                <p style="font-size: 13px; color: #ccc; margin-bottom: 20px;">D/F/J/K キー または<br>画面タップでノーツを叩こう！</p>
                <button class="action-btn" onclick="startGame()">START</button>
            </div>

            <!-- リザルト画面 -->
            <div id="result-overlay" class="overlay" style="display: none;">
                <h2 style="margin: 0; font-size: 20px;">CLEAR!</h2>
                <div id="result-rank" class="result-rank">SS</div>
                <div id="full-combo-text" style="display: none;">★ FULL COMBO ★</div>
                <div class="result-stats">
                    <div>SCORE: <b id="res-score" style="color:#00f6ff;">0</b></div>
                    <div>MAX COMBO: <b id="res-maxcombo" style="color:#ffe600;">0</b></div>
                    <hr style="border: 0.5px solid #444; margin: 6px 0;">
                    <div>PERFECT: <span id="res-perfect">0</span></div>
                    <div>GREAT: <span id="res-great">0</span></div>
                    <div>GOOD: <span id="res-good">0</span></div>
                    <div>MISS: <span id="res-miss">0</span></div>
                </div>
                <button class="action-btn" onclick="startGame()">RETRY</button>
            </div>
        </div>

        <!-- キーガイド（PC・タップ両用） -->
        <div id="key-guides">
            <div class="key-guide" id="guide-0">D</div>
            <div class="key-guide" id="guide-1">F</div>
            <div class="key-guide" id="guide-2">J</div>
            <div class="key-guide" id="guide-3">K</div>
        </div>

        <!-- 2. スコア & 3. タイトル & 全画面切替 -->
        <div id="game-footer">
            <div id="score-board">SCORE: <span id="score">0</span></div>
            <h1 style="margin: 0; font-size: 11px; font-weight: normal; color: #777;">うさぎロケット</h1>
            <button class="fullscreen-btn" onclick="toggleFullscreen()">⛶ 全画面切替</button>
        </div>
    </div>

    <script>
        const LANE_KEYS = ['KeyD', 'KeyF', 'KeyJ', 'KeyK'];
        const NOTE_FALL_TIME = 2.5;

        let judgeLineY = 400; // 動的に計算
        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let startTime = 0;
        let isPlaying = false;
        let chartData = [];
        let activeNotes = [];
        let judgeTimer = null;

        // 判定カウント用
        let countPerfect = 0;
        let countGreat = 0;
        let countGood = 0;
        let countMiss = 0;

        // 判定ラインの高さを動的に計算
        function updateDimensions() {
            // スマホのアドレスバー等を除いた「実際に見えている高さ」をCSSに反映
            const vh = (window.visualViewport ? window.visualViewport.height : window.innerHeight);
            document.documentElement.style.setProperty('--app-h', vh + 'px');
            const container = document.getElementById('game-container');
            if (container) {
                // 判定ラインの実際の位置（CSSの bottom 値）から判定位置を求める
                const jl = document.getElementById('judge-line');
                const bottom = jl ? parseFloat(getComputedStyle(jl).bottom) : 45;
                judgeLineY = container.clientHeight - bottom;
            }
        }
        window.addEventListener('resize', updateDimensions);
        window.addEventListener('orientationchange', updateDimensions);
        window.addEventListener('load', updateDimensions);
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', updateDimensions);
        }
        updateDimensions();

        // 全画面表示の切替処理
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => console.log(err));
                } else if (elem.webkitRequestFullscreen) { /* Safari */
                    elem.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen().catch(err => console.log(err));
                } else if (document.webkitExitFullscreen) { /* Safari */
                    document.webkitExitFullscreen();
                }
            }
        }

        // 総ノーツ数487個の譜面生成（曲長5:14 / BPM 135）
        function generateChart() {
            const chart = [];
            const bpm = 135;
            const beatDuration = 60 / bpm;
            const START_OFFSET = 5; // 最初5秒はノーツなし
            
            const sections = [
                { start: 0,   end: 30,  intervalBeats: 1 },
                { start: 30,  end: 90,  intervalBeats: 0.75 },
                { start: 90,  end: 140, intervalBeats: 0.5 },
                { start: 140, end: 190, intervalBeats: 0.75 },
                { start: 190, end: 240, intervalBeats: 0.5 },
                { start: 240, end: 270, intervalBeats: 0.75 },
                { start: 270, end: 300, intervalBeats: 0.5 },
                { start: 300, end: 314, intervalBeats: 0.75 }
            ];

            let currentLane = 0;

            sections.forEach(sec => {
                let currentTime = sec.start + START_OFFSET;
                const interval = beatDuration * sec.intervalBeats;

                while (currentTime < sec.end + START_OFFSET) {
                    currentLane = (currentLane + Math.floor(Math.random() * 3) + 1) % 4;

                    chart.push({
                        time: parseFloat(currentTime.toFixed(2)),
                        lane: currentLane,
                        spawned: false,
                        hit: false
                    });

                    currentTime += interval;
                }
            });

            return chart;
        }

        function startGame() {
            updateDimensions();

            document.getElementById('start-overlay').style.display = 'none';
            document.getElementById('result-overlay').style.display = 'none';
            
            // 既存のノーツエレメント・エフェクトを全て削除
            document.querySelectorAll('.note, .hit-effect').forEach(el => el.remove());

            // スコア・パラメータのリセット
            score = 0;
            combo = 0;
            maxCombo = 0;
            countPerfect = 0;
            countGreat = 0;
            countGood = 0;
            countMiss = 0;

            document.getElementById('score').innerText = score;
            updateComboUI();

            chartData = generateChart();
            activeNotes = [];

            const bgm = document.getElementById('bgm');
            bgm.currentTime = 0;
            
            bgm.onended = () => {
                endGame();
            };

            bgm.play().then(() => {
                startTime = performance.now();
                isPlaying = true;
                requestAnimationFrame(updateGame);
            }).catch(err => {
                console.error("再生失敗:", err);
                startTime = performance.now();
                isPlaying = true;
                requestAnimationFrame(updateGame);
            });
        }

        function updateGame(now) {
            if (!isPlaying) return;

            const elapsedTime = (now - startTime) / 1000;

            // ノーツ出現チェック
            chartData.forEach(note => {
                if (!note.spawned && elapsedTime >= note.time - NOTE_FALL_TIME) {
                    createNoteElement(note);
                    note.spawned = true;
                }
            });

            // ノーツ移動＆MISS判定
            for (let i = activeNotes.length - 1; i >= 0; i--) {
                const noteObj = activeNotes[i];
                const noteTime = noteObj.data.time;
                const progress = 1 - (noteTime - elapsedTime) / NOTE_FALL_TIME;
                const currentY = progress * judgeLineY;

                noteObj.el.style.top = `${currentY}px`;

                if (progress > 1.25 && !noteObj.data.hit) {
                    countMiss++;
                    combo = 0;
                    updateComboUI();
                    showJudgement('MISS', 'judge-miss');
                    
                    noteObj.el.remove();
                    activeNotes.splice(i, 1);
                }
            }

            if (elapsedTime > 319 && activeNotes.length === 0) {
                endGame();
                return;
            }

            requestAnimationFrame(updateGame);
        }

        function createNoteElement(note) {
            const laneEl = document.getElementById(`lane-${note.lane}`);
            const noteEl = document.createElement('div');
            noteEl.className = 'note';
            noteEl.style.top = '0px';
            laneEl.appendChild(noteEl);

            activeNotes.push({
                data: note,
                el: noteEl
            });
        }

        function createHitEffect(laneIndex) {
            const laneEl = document.getElementById(`lane-${laneIndex}`);
            const effect = document.createElement('div');
            effect.className = 'hit-effect';
            effect.style.top = `${judgeLineY - 18}px`;
            laneEl.appendChild(effect);

            setTimeout(() => { effect.remove(); }, 250);
        }

        function showJudgement(text, className) {
            const judgeEl = document.getElementById('judge-text');
            judgeEl.innerText = text;
            judgeEl.className = className;
            
            judgeEl.style.opacity = '1';
            judgeEl.style.transform = 'translate(-50%, -50%) scale(1.3)';

            clearTimeout(judgeTimer);
            judgeTimer = setTimeout(() => {
                judgeEl.style.opacity = '0';
                judgeEl.style.transform = 'translate(-50%, -50%) scale(1.0)';
            }, 300);
        }

        function updateComboUI() {
            const comboContainer = document.getElementById('combo-container');
            const comboCountEl = document.getElementById('combo-count');

            if (combo >= 2) {
                comboCountEl.innerText = combo;
                comboContainer.style.opacity = '1';
                comboContainer.style.transform = 'translate(-50%, -50%) scale(1.15)';
                setTimeout(() => {
                    comboContainer.style.transform = 'translate(-50%, -50%) scale(1.0)';
                }, 80);
            } else {
                comboContainer.style.opacity = '0';
            }

            if (combo > maxCombo) {
                maxCombo = combo;
            }
        }

        // --- 共通：レーン押下処理（キーボード・タッチ共通） ---
        function handleLanePress(laneIndex) {
            const laneEl = document.getElementById(`lane-${laneIndex}`);
            const guideEl = document.getElementById(`guide-${laneIndex}`);
            if (laneEl) laneEl.classList.add('active');
            if (guideEl) guideEl.classList.add('active');

            if (!isPlaying) return;

            const elapsedTime = (performance.now() - startTime) / 1000;
            const targetNoteIndex = activeNotes.findIndex(
                n => n.data.lane === laneIndex && !n.data.hit
            );

            if (targetNoteIndex !== -1) {
                const targetNote = activeNotes[targetNoteIndex];
                const timeDiff = Math.abs(elapsedTime - targetNote.data.time);

                let baseScore = 0;

                if (timeDiff <= 0.08) {
                    baseScore = 300;
                    countPerfect++;
                    combo++;
                    showJudgement('PERFECT!', 'judge-perfect');
                    createHitEffect(laneIndex);
                    hitSuccess(targetNote, targetNoteIndex);
                } else if (timeDiff <= 0.20) {
                    baseScore = 200;
                    countGreat++;
                    combo++;
                    showJudgement('GREAT', 'judge-great');
                    createHitEffect(laneIndex);
                    hitSuccess(targetNote, targetNoteIndex);
                } else if (timeDiff <= 0.38) {
                    baseScore = 100;
                    countGood++;
                    combo++;
                    showJudgement('GOOD', 'judge-good');
                    createHitEffect(laneIndex);
                    hitSuccess(targetNote, targetNoteIndex);
                }

                if (baseScore > 0) {
                    score += baseScore + Math.floor(combo * 10);
                    document.getElementById('score').innerText = score.toLocaleString();
                    updateComboUI();
                }
            }
        }

        // --- 共通：レーン解放処理（キーボード・タッチ共通） ---
        function handleLaneRelease(laneIndex) {
            const laneEl = document.getElementById(`lane-${laneIndex}`);
            const guideEl = document.getElementById(`guide-${laneIndex}`);
            if (laneEl) laneEl.classList.remove('active');
            if (guideEl) guideEl.classList.remove('active');
        }

        function hitSuccess(noteObj, index) {
            noteObj.data.hit = true;
            noteObj.el.remove();
            activeNotes.splice(index, 1);
        }

        // --- 入力イベントリスナーの登録 ---
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const laneIndex = LANE_KEYS.indexOf(e.code);
            if (laneIndex !== -1) handleLanePress(laneIndex);
        });

        window.addEventListener('keyup', (e) => {
            const laneIndex = LANE_KEYS.indexOf(e.code);
            if (laneIndex !== -1) handleLaneRelease(laneIndex);
        });

        // スマホ用タッチ操作の登録
        for (let i = 0; i < 4; i++) {
            const laneEl = document.getElementById(`lane-${i}`);
            const guideEl = document.getElementById(`guide-${i}`);

            laneEl.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleLanePress(i);
            }, { passive: false });

            laneEl.addEventListener('touchend', (e) => {
                e.preventDefault();
                handleLaneRelease(i);
            }, { passive: false });

            if (guideEl) {
                guideEl.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    handleLanePress(i);
                }, { passive: false });

                guideEl.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    handleLaneRelease(i);
                }, { passive: false });
            }
        }

        // --- リザルト画面処理 ---
        function endGame() {
            isPlaying = false;

            const bgm = document.getElementById('bgm');
            bgm.pause();

            // 理論値（1,334,380点）に対する厳格ランク判定
            let rank = 'C';
            if (score >= 1200000) rank = 'SS';
            else if (score >= 900000) rank = 'S';
            else if (score >= 600000) rank = 'A';
            else if (score >= 350000) rank = 'B';

            document.getElementById('res-score').innerText = score.toLocaleString();
            document.getElementById('res-maxcombo').innerText = maxCombo;
            document.getElementById('res-perfect').innerText = countPerfect;
            document.getElementById('res-great').innerText = countGreat;
            document.getElementById('res-good').innerText = countGood;
            document.getElementById('res-miss').innerText = countMiss;
            
            const rankEl = document.getElementById('result-rank');
            rankEl.innerText = rank;

            if (rank === 'SS') {
                rankEl.style.color = '#ffffff';
                rankEl.style.textShadow = '0 0 20px #ffe600, 0 0 40px #ff00aa';
            } else if (rank === 'S') {
                rankEl.style.color = '#ffe600';
                rankEl.style.textShadow = '0 0 25px #ffe600';
            } else if (rank === 'A') {
                rankEl.style.color = '#ff2a6d';
                rankEl.style.textShadow = '0 0 20px #ff2a6d';
            } else if (rank === 'B') {
                rankEl.style.color = '#00f6ff';
                rankEl.style.textShadow = '0 0 15px #00f6ff';
            } else {
                rankEl.style.color = '#888888';
                rankEl.style.textShadow = 'none';
            }

            const fcText = document.getElementById('full-combo-text');
            if (countMiss === 0 && (countPerfect + countGreat + countGood) > 0) {
                fcText.style.display = 'block';
            } else {
                fcText.style.display = 'none';
            }

            document.getElementById('result-overlay').style.display = 'flex';
        }
    </script>
</body>
</html>
